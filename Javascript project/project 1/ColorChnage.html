<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background-color switcher</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;    
        }
        .canvas {
            padding: 20px;
            background-color: hwb(0 19% 73%);
            border-radius: 10%;
            height: 10cm;
            width: 10cm;
            text-align: center;
        }

        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        .button {
            display: inline-block;
            height: 85px;
            width: 85px;
            border-radius: 5px;
            border: 2px solid black;
            cursor: pointer;
            align-items: center;
        }

        #gray {
            background-color: gray;
        }

        #palevioletred {
            background-color:  palevioletred;
        }

        #yellow {
            background-color: yellow;
        }

        #white {
            background-color: white;
        }
    </style>
</head>

<body>
    <div class="canvas">
        <h1> Color scheme switcher </h1>
        <span class="button" id="gray"></span>
        <span class="button" id="white"></span>
        <span class="button" id="palevioletred"></span>
        <span class="button" id="yellow"></span>
        <h2> Try clicking on the colors above <br>
            <span>
                To change the background color of this page
            </span>
        </h2>

    </div>
</body>
<script src="color.js"></script>
</html>
